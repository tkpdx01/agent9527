[package]
name = "agent9527-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "agent9527-app-server"
path = "src/main.rs"

[[bin]]
name = "agent9527-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[[bin]]
name = "exec-server"
path = "src/bin/exec_server.rs"

[lib]
name = "agent9527_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
