[package]
name = "agent9527-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "agent9527"
path = "src/main.rs"

[lib]
name = "agent9527_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
agent9527-app-server = { workspace = true }
agent9527-app-server-daemon = { workspace = true }
agent9527-app-server-protocol = { workspace = true }
agent9527-app-server-test-client = { workspace = true }
agent9527-arg0 = { workspace = true }
agent9527-api = { workspace = true }
agent9527-chatgpt = { workspace = true }
agent9527-cloud-tasks = { path = "../cloud-tasks" }
agent9527-utils-cli = { workspace = true }
agent9527-config = { workspace = true }
agent9527-core = { workspace = true }
agent9527-core-plugins = { workspace = true }
agent9527-home = { workspace = true }
agent9527-exec = { workspace = true }
agent9527-exec-server = { workspace = true }
agent9527-execpolicy = { workspace = true }
agent9527-features = { workspace = true }
agent9527-git-utils = { workspace = true }
agent9527-install-context = { workspace = true }
agent9527-login = { workspace = true }
agent9527-memories-write = { workspace = true }
agent9527-mcp = { workspace = true }
agent9527-mcp-server = { workspace = true }
agent9527-model-provider = { workspace = true }
agent9527-models-manager = { workspace = true }
agent9527-plugin = { workspace = true }
agent9527-protocol = { workspace = true }
agent9527-responses-api-proxy = { workspace = true }
agent9527-rmcp-client = { workspace = true }
agent9527-rollout = { workspace = true }
agent9527-rollout-trace = { workspace = true }
agent9527-sandboxing = { workspace = true }
agent9527-state = { workspace = true }
agent9527-stdio-to-uds = { workspace = true }
agent9527-terminal-detection = { workspace = true }
agent9527-tui = { workspace = true }
agent9527-utils-absolute-path = { workspace = true }
agent9527-utils-path = { workspace = true }
crossterm = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
agent9527_windows_sandbox = { package = "agent9527-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
app_test_support = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
agent9527-utils-cargo-bin = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
# These Rust sources are intentionally Bazel-only macrobenchmarks rather than
# Cargo targets.
ignored-paths = ["e2e_benches/*.rs"]
