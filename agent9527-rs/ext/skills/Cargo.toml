[package]
edition.workspace = true
license.workspace = true
name = "agent9527-skills-extension"
version.workspace = true

[lib]
name = "agent9527_skills_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
agent9527-core-skills = { workspace = true }
agent9527-exec-server = { workspace = true }
agent9527-extension-api = { workspace = true }
agent9527-mcp = { workspace = true }
agent9527-otel = { workspace = true }
agent9527-protocol = { workspace = true }
agent9527-tools = { workspace = true }
agent9527-utils-path-uri = { workspace = true }
agent9527-utils-string = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
agent9527-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
