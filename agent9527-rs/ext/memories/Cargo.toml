[package]
edition.workspace = true
license.workspace = true
name = "agent9527-memories-extension"
version.workspace = true

[lib]
name = "agent9527_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
agent9527-core = { workspace = true }
agent9527-extension-api = { workspace = true }
agent9527-features = { workspace = true }
agent9527-otel = { workspace = true }
agent9527-tools = { workspace = true }
agent9527-utils-absolute-path = { workspace = true }
agent9527-utils-output-truncation = { workspace = true }
agent9527-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
