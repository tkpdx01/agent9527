[package]
edition.workspace = true
license.workspace = true
name = "agent9527-goal-extension"
version.workspace = true

[lib]
name = "agent9527_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
agent9527-analytics = { workspace = true }
agent9527-core = { workspace = true }
agent9527-extension-api = { workspace = true }
agent9527-otel = { workspace = true }
agent9527-protocol = { workspace = true }
agent9527-state = { workspace = true }
agent9527-tools = { workspace = true }
agent9527-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
