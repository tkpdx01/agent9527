name: Publish Agent9527 npm artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Workflow run containing the npm artifact
        required: true
        type: string
      artifact_name:
        description: npm artifact to publish
        required: true
        type: choice
        options:
          - npm-win32-x64
          - npm-win32-arm64
          - npm-linux-x64
          - npm-linux-arm64
          - npm-darwin-x64
          - npm-darwin-arm64
          - npm-root

concurrency:
  group: agent9527-publish-artifact-${{ inputs.source_run_id }}-${{ inputs.artifact_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ inputs.artifact_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/npm
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          scope: "@tkpdx01"

      - name: Publish npm artifact
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find dist/npm -type f -name '*.tgz' -print)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one npm tarball, found ${#tarballs[@]}." >&2
            exit 1
          fi

          tarball="${tarballs[0]}"
          package_json="$(tar -xOf "$tarball" package/package.json)"
          package_name="$(jq -r '.name' <<< "$package_json")"
          package_version="$(jq -r '.version' <<< "$package_json")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "Skipping existing ${package_name}@${package_version}."
            exit 0
          fi

          case "$ARTIFACT_NAME" in
            npm-win32-x64) npm_tag="platform-win32-x64" ;;
            npm-win32-arm64) npm_tag="platform-win32-arm64" ;;
            npm-linux-x64) npm_tag="platform-linux-x64" ;;
            npm-linux-arm64) npm_tag="platform-linux-arm64" ;;
            npm-darwin-x64) npm_tag="platform-darwin-x64" ;;
            npm-darwin-arm64) npm_tag="platform-darwin-arm64" ;;
            npm-root) npm_tag="latest" ;;
            *) echo "Unexpected artifact: ${ARTIFACT_NAME}" >&2; exit 1 ;;
          esac

          npm publish "$tarball" \
            --access public \
            --provenance \
            --tag "$npm_tag"
